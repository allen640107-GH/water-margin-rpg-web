<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>水滸傳：替天行道</title>
<link rel="preload" href="fonts/title.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/p_linchong.webp">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="地圖"></canvas>
  <div id="hud" hidden>
    <div id="loc"></div>
    <div id="hud-r">
      <span id="gold"></span>
      <button id="btn-mute" class="hbtn" aria-label="音樂開關">♪</button>
      <button id="btn-menu" class="hbtn">選單</button>
    </div>
  </div>
  <div id="pads" hidden>
    <div id="dpad">
      <button data-d="0" class="dp du" aria-label="上"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><polygon points="12,4 21,19 3,19" fill="currentColor"/></svg></button>
      <button data-d="3" class="dp dl" aria-label="左"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><polygon points="4,12 19,3 19,21" fill="currentColor"/></svg></button>
      <button data-d="1" class="dp dr" aria-label="右"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><polygon points="20,12 5,3 5,21" fill="currentColor"/></svg></button>
      <button data-d="2" class="dp dd" aria-label="下"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><polygon points="12,20 21,5 3,5" fill="currentColor"/></svg></button>
    </div>
    <button id="btn-act">調查</button>
  </div>
  <div id="cg" hidden></div>
  <div id="dialog" hidden>
    <img class="por" alt="">
    <div class="box"><div class="name"></div><div class="text"></div><div class="more"></div></div>
  </div>
  <div id="choices" hidden></div>
  <div id="battle" hidden></div>
  <div id="menu" hidden></div>
  <div id="panel" hidden></div>
  <div id="title" hidden></div>
  <div id="intro" hidden></div>
  <div id="caption" hidden></div>
  <div id="toasts"></div>
  <div id="fade"></div>
  <div id="boot">載入中……</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
